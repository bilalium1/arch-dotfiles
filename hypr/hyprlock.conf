source = ~/.config/hypr/configs/wallust-hypr.conf

$font = 911 Porscha Bold Italic
$TIME = cmd[update:1000] date +"%H:%M"

# GENERAL
general {
	hide_cursor = true
}

animations {
	enabled = true
	bezier = linear, 1, 1, 0, 0
	animation = fadeIn, 2, 2, out
}

# BACKGROUND
background {
	monitor =
	path = /tmp/current_wallpaper.jpg
	blur_passes = 2
	color = rgba($bg)
	crossfade_time = 100.0
	brightness = 0.8
	vibrancy = 2.0
	contrast = 2.0
}

image {
	monitor =
	rotate= 0
	path = /tmp/current_wallpaper.jpg
	size = 950
	rounding = 10
	border_size = 0
	border_color = rgba($color6)

	shadow_passes = 2
	shadow_size = 2
	shadow_color = rgb(15, 0, 20)
	shadow_boost = 0.3
}

image {
	monitor = 0
	path = ~/Pictures/sonicthumbs.png
	size = 200
	zindex = 6
	position = -120,60
	border_size = 0
	halign=right
	valign=bottom
	
}

# SONG NAME

label {
	monitor = 0
	text = cmd[update:1000] echo "$(playerctl metadata title | tr '[:lower:]' '[:upper:]')"
	color = rgba($fg)
	font_size = 28
	font_family = Stretch Pro
	position = 400, 280
	halign = left
	valign = bottom

	shadow_passes = 2
	shadow_size = 1
	shadow_color = rgba($bg)
	shadow_boost = 0.3
}

label {
	monitor = 0
	text = cmd[update:1000] echo "$(playerctl metadata artist | tr '[:upper:]' '[:lower:]')"
	color = rgba($fg)
	font_size = 22
	font_family = Montserrat Bold
	position = 400, 235
	halign = left
	valign = bottom
	zindex = 19

	shadow_passes = 2
	shadow_size = 1
	shadow_color = rgba($bg)
	shadow_boost = 0.3
}
# ALBUM COVER

image {
	path = /home/genesis/.config/hypr/vynil-mapped.png
	size = 240
	zindex = 0
	position = -580, -330
	border_size = 0
	border_color = rgba($fg)

	shadow_passes = 2
	shadow_size = 2
	shadow_color = rgb(15, 0, 20)
	shadow_boost = 0.3

	reload_time = 0
	reload_cmd =
