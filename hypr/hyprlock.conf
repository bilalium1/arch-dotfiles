source = ~/.config/hypr/configs/wallust-hypr.conf

$font = 911 Porscha Bold Italic
$TIME = cmd[update:1000] date +"%H:%M"

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = /tmp/current_wallpaper.jpg
  blur_passes = 2
  color = rbga($fg)
  crossfade_time = 5.0
  brightness = 0.8
  vibarncy = 1.5
  contrats = 2.0
}

image {
  path = /tmp/current_wallpaper.jpg
  size = 800
  rounding = 50
  border_size = 2
  border_color = rgba($color6)
  shadow_passes = 4
  shadow_size = 5
  shadow_color = rgb(15, 0, 20)
  shadow_boost = 1.2
}

image {
  path = ~/Pictures/sonicthumbs.png
  size = 200
  zindex = 6
  position = 300, -170
  border_size = 0
}

image {
  path = ~/Pictures/sonic_clrd.png
  size = 200
  zindex = 5
  position = 290, -175
  border_size = 0
}

shape {
  rotate = 1
  monitor =
  size = 780, 100
  rounding = 10
  position = 0,400
  color = rgba($color6)
  zindex = 2
  halign = center
  valign = center

  shadow_passes = 4
  shadow_size = 5
  shadow_color = rgb(15, 0, 20)
  shadow_boost = 1.2
}

# TIME
label {
  monitor =
  text = $TIME
  color = rgba($fg)
  font_size = 40
  font_family = Elastik
  position = 0, 400
  zindex = 10
  halign = center
  valign = center
}

label {
  monitor =
  text = sega
  color = rgba($fg)
  font_size = 90
  font_family = SEGA LOGO FONT
  position = 0, 0
  zindex = 4
  halign = center
  valign = center

  shadow_passes = 3
  shadow_size = 5
  shadow_color = rgb(15, 0, 20)
  shadow_boost = 1.5
}

label {
  monitor =
  text = Bilalium
  color = rgba($color6)
  font_size = 60
  font_family = Autography
  position = 0, -60
  zindex = 4
  halign = center
  valign = center
}

label {
  monitor =
  text = Be Right Back!
  color = rgba($fg)
  font_size = 40
  font_family = Montserrat Bold
  position = 0, -120
  zindex = 4
  halign = center
  valign = center
  shadow_passes = 3
  shadow_size = 2
  shadow_color = rgb(15, 0, 20)
  shadow_boost = 1.1
}

# DATE
#label {
#  monitor =
#  text = cmd[update:43200000] date +"%A, %d %B %Y"
#  color = $text
#  font_size = 25
#  font_family = $font
#  position = -30, -150
#  halign = right
#  valign = top
#}

# FINGERPRINT
{
  monitor = "";
  text = "$FPRINTPROMPT";
  color = "$text";
  font_size = 14;
  font_family = $font;
  position = "0, -107";
  halign = "center";
  valign = "center";
}

# USER AVATAR
image {
  path = $HOME/.face
  size = 0
  border_color = $accent
  position = 0, 200
  halign = center
  valign = center
  shadow_passes = 2
  shadow_color = rgb(15,0,20)
  shadow_size = 5
  shadow_boost = 1.2
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 0
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba($color6)
  inner_color = rgba($color6)
  font_family = 911 Porscha
  font_color = rgba($fg)
  fade_on_empty = true
  placeholder_text = B//
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgba($color1)
  position = 0, -400
  halign = center
  valign = center
}
