	text = cmd[update:43200000] date +"%A, %d %B %Y"
	color = rgba($fg)
	font_size = 50
	font_family = Crude
	position = -30, -300
	halign = center
	valign = center
}

# USER AVATAR
image {
	path = $HOME/.face
	size = 0
	border_color = rgba($color4)
	position = 0, 200
	halign = center
	valign = center
	shadow_passes = 2
	shadow_color = rgb(15,0,20)
	shadow_size = 5
	shadow_boost = 1.2
}

# INPUT FIELD
input-field {
	monitor =
	size = 120, 50
	outline_thickness = 0
	dots_size = 0.1
	dots_spacing = 0.2
	dots_center = true
	outer_color = rgba($color6)
	inner_color = rgba($color6)
	font_family = Montserrat
	font_color = rgba($fg)
	fade_on_empty = true
	placeholder_text = B//
	hide_input = false
	check_color = rgba($color2)
	fail_color = rgba($color1)
	fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
	capslock_color = rgba($color1)
	position = 0, -400
	halign = center
	valign = center
	zindex = 5
}
